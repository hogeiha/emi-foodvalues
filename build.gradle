plugins {
    id 'eclipse'
    // ForgeGradle 6 needs Gradle 8.1+ (wrapper is 8.5)
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.hogeiha.emifoodvalues'
archivesBaseName = 'emifoodvalues-1.19.2'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Official (Mojang) mappings
    mappings channel: 'official', version: '1.19.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                emifoodvalues {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                emifoodvalues {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // Offline alternative to the EMI maven, use -PemiLocalRepo=C:/path/to/local-maven
    def localEmiRepo = findProperty('emiLocalRepo')
    if (localEmiRepo != null) {
        maven {
            name = 'LocalEMI'
            url = localEmiRepo
            content {
                includeGroup 'dev.emi'
            }
        }
    }
    // EMI, Forge 1.19.2 build. Restricted to dev.emi so nothing else is resolved from here.
    maven {
        name = 'SleepingTown'
        url = 'https://repo.sleeping.town/'
        content {
            includeGroup 'dev.emi'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.3.8'

    // ":api" is EMI's public API jar
    compileOnly fg.deobf('dev.emi:emi-forge:1.1.24+1.19.2:api')
    // only needed for runClient
    runtimeOnly fg.deobf('dev.emi:emi-forge:1.1.24+1.19.2')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id           : 'emifoodvalues',
            mod_name         : 'EMI Food Values',
            mod_license      : 'MIT',
            mod_version      : project.version,
            mod_authors      : 'hogeiha',
            mod_description  : 'Adds EMI categories that list every food with its hunger and saturation value.'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'    : 'emifoodvalues',
                'Specification-Vendor'   : 'hogeiha',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'hogeiha'
        ])
    }
}
